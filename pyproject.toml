[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onuki2007-companion"
version = "0.1.0"
description = "Runnable finite verification checks for the Onuki 2007 guided-derivation companion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sympy>=1.12",
  "pint>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
onuki2007-check = "onuki2007_companion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
